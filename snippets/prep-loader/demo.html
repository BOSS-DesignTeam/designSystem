<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prep Loader demo</title>
<link rel="stylesheet" href="prep-loader.css">
<style>
  html, body{height:100%; margin:0;}
  body{display:grid; place-items:center; font-family:system-ui, sans-serif; background:#f4f6f5; color:#22292b; padding-inline:16px;}
  @media (prefers-color-scheme: dark){ body{background:#1c2123; color:#e8ecea;} }
</style>
</head>
<body>
<div class="prep-loader" data-prep-loader role="status" aria-live="polite">
  <canvas></canvas>
  <p class="prep-loader__title">Getting things ready</p>
  <p class="prep-loader__step" data-prep-loader-step></p>
</div>
<script src="prep-loader.js"></script>
</body>
</html>
